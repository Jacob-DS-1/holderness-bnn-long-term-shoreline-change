# CoastSat extraction environment for the commit recorded in COASTSAT_REVISION.
# Keep this separate from the Python 3.11 analysis environment: the pretrained
# classifiers and older geospatial stack are tested here on Python 3.10.

name: coastsat310

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10

  # Versions already used successfully with the pinned CoastSat checkout.
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - matplotlib=3.10.8
  - astropy=6.1.7
  - scikit-image=0.25.0
  - scikit-learn=1.7.2
  # scikit-image 0.25 requires Pillow 10.1 or newer.
  - pillow>=10.1,<12

  - geopandas=1.1.3
  - shapely
  - pyproj
  - gdal

  - earthengine-api=1.7.18
  - imageio=2.37.0
  - joblib=1.5.3
  - pytz>=2026.1
  - requests>=2.32
  - jupyter>=1.1
  - pip

# After creating the environment, install this project (not CoastSat) editable:
#
#   conda env create -f environment.coastsat.yml
#   conda run -n coastsat310 python -m pip install -e .
#   conda run -n coastsat310 python scripts/check-environment.py coastsat
#   conda run -n coastsat310 python -m pip check
#
# The smoke test imports CoastSat from the sibling checkout; CoastSat itself has
# no install metadata at the pinned revision.
